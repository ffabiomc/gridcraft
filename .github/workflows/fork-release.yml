# Release build for this fork: GridCraft for Linux x86_64 (RPM for Fedora, plus AppImage and tar.gz).
#
# Push a tag such as v0.19.1 (or run it by hand under Actions) and this workflow builds the packages
# and publishes a GitHub Release with them. Nothing is signed: the upstream signing keys belong to
# storytold. Upstream's own release.yml is left untouched, so syncing the fork does not conflict.
#
#   git tag v0.19.1 && git push origin v0.19.1
#
# Install on Fedora:  sudo dnf install ./gridcraft-<version>-linux-x86_64.rpm

name: Fork release (Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.19.1 (empty: the version in Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build and release Linux x86_64
    # Ubuntu 22.04 (glibc 2.35), as upstream does, so the binaries also run on newer distros such as Fedora.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    # Only actions/checkout is used, at the version already pinned in actions.lock; everything else
    # is plain shell, so the Lockfile check stays green without regenerating the lockfile.
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # The same craft-fonts commit upstream's release.yml pins (fallback fonts for CJK, etc.).
      CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 787af76e172dd5fc7cedf4d7c5a090a2f62be9001557a4db1103e270f90ddefd
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$cargo_version"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 0.19.1 or 0.19.1-fork.1"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "cargo_version=$cargo_version" >>"$GITHUB_OUTPUT"
          echo "Building GridCraft $version (Cargo.toml: $cargo_version)" >>"$GITHUB_STEP_SUMMARY"

      - name: Check out craft-fonts
        uses: actions/checkout@v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false

      - name: Install build and packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libasound2-dev pkg-config desktop-file-utils appstream python3-yaml zsync rpm
          curl --proto '=https' --proto-redir =https -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version && nfpm --version

      - name: Apply version
        if: steps.version.outputs.version != steps.version.outputs.cargo_version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask version set "$VERSION"

      - name: Build and package (RPM, AppImage, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          GRIDCRAFT_MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: packaging/linux/package.sh --formats "rpm appimage tar"

      - name: Check the packages
        run: |
          set -euo pipefail
          ls -la dist/release
          rpm -qip dist/release/*.rpm || true
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
          done
          (cd dist/release && sha256sum -- * > SHA256SUMS.txt)

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          notes="GridCraft $VERSION built from ${SHA:0:12} for Linux x86_64 (unsigned).

          Fedora: \`sudo dnf install ./gridcraft-$VERSION-linux-x86_64.rpm\`"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* --target "$SHA" --title "GridCraft $VERSION" --notes "$notes" "${prerelease[@]}"
          fi
          echo "Release: https://github.com/$GH_REPO/releases/tag/$tag" >>"$GITHUB_STEP_SUMMARY"
