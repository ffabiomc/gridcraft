# Release build for this fork: GridCraft for Linux x86_64 (RPM for Fedora, plus AppImage and tar.gz).
#
# Push a tag such as v0.19.1 (or run it by hand under Actions) and this workflow builds the packages
# and publishes a GitHub Release with them. Nothing is signed: the upstream signing keys belong to
# storytold. Upstream's own release.yml is left untouched, so syncing the fork does not conflict.
#
#   git tag v0.19.1 && git push origin v0.19.1
#
# Install on Fedora:  sudo dnf install ./gridcraft-<version>-linux-x86_64.rpm

name: Fork release (Linux)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.19.1 (empty: the version in Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux x86_64
    # Ubuntu 22.04 (glibc 2.35), as upstream does, so the binaries also run on newer distros such as Fedora.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # The same craft-fonts commit upstream's release.yml pins (fallback fonts for CJK, etc.).
      CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$cargo_version"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 0.19.1 or 0.19.1-fork.1"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "cargo_version=$cargo_version" >>"$GITHUB_OUTPUT"
          echo "Building GridCraft $version (Cargo.toml: $cargo_version)" >>"$GITHUB_STEP_SUMMARY"

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false

      - name: Check out craft-i18n (if pinned)
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main

      - name: Install build and packaging tools
        uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: amd64

      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@main

      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fork-release-linux-x86_64

      - name: Apply version
        if: steps.version.outputs.version != steps.version.outputs.cargo_version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask version set "$VERSION"

      - name: Build and package (RPM, AppImage, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          GRIDCRAFT_MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: packaging/linux/package.sh --formats "rpm appimage tar"

      - name: Check the packages
        run: |
          set -euo pipefail
          ls -la dist/release
          rpm -qip dist/release/*.rpm || true
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
          done
          (cd dist/release && sha256sum -- * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gridcraft-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gridcraft-linux-x86_64
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.linux.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          notes="GridCraft $VERSION built from ${SHA:0:12} for Linux x86_64 (unsigned).

          Fedora: \`sudo dnf install ./gridcraft-$VERSION-linux-x86_64.rpm\`"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$SHA" --title "GridCraft $VERSION" --notes "$notes" "${prerelease[@]}"
          fi
          echo "Release: https://github.com/$GH_REPO/releases/tag/$tag" >>"$GITHUB_STEP_SUMMARY"
